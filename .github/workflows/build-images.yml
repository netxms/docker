name: Build and Publish Docker Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'release-*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish
        required: true
        type: choice
        options:
          - server-e2e
          - agent
          - server
          - web
      tag:
        description: Version-prefixed image tag with a suffix (e.g. 7.0.0-e2e.1)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.component)) || fromJSON('["agent","server","server-e2e","web"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from build.properties
        id: version
        run: |
          NETXMS_VERSION=$(grep '^NETXMS_VERSION=' build.properties | cut -d= -f2)
          NETXMS_PACKAGE_VERSION=$(grep '^NETXMS_PACKAGE_VERSION=' build.properties | cut -d= -f2)
          echo "netxms_version=${NETXMS_VERSION}" >> $GITHUB_OUTPUT
          echo "package_version=${NETXMS_PACKAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Validate manual publish
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
          NETXMS_VERSION: ${{ steps.version.outputs.netxms_version }}
          SELECTED_COMPONENT: ${{ inputs.component }}
          BUILD_COMPONENT: ${{ matrix.component }}
        run: |
          case "$SELECTED_COMPONENT" in
            agent|server|server-e2e|web) ;;
            *) echo "::error::Unknown component"; exit 1 ;;
          esac
          if [[ "$SELECTED_COMPONENT" != "$BUILD_COMPONENT" ]]; then
            echo "::error::Manual publish must build only the selected component"
            exit 1
          fi
          if [[ "$PUBLISH_TAG" != "$NETXMS_VERSION"-?* || ! "$PUBLISH_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag must be a valid Docker tag starting with $NETXMS_VERSION- and a nonempty suffix"
            exit 1
          fi

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          flavor: latest=${{ github.event_name == 'workflow_dispatch' && 'false' || 'auto' }}
          tags: |
            type=match,pattern=release-(\d+\.\d+\.\d+)$,group=1,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=match,pattern=release-(\d+\.\d+)\.\d+$,group=1,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.netxms_version }},enable=${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/release-') }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Download NetXMS web archive
        if: matrix.component == 'web'
        run: |
          VERSION=${{ steps.version.outputs.netxms_version }}
          if [ ! -f web/nxmc-${VERSION}.war ]; then
            curl -L -o web/nxmc-${VERSION}.war https://netxms.org/download/releases/$(echo ${VERSION} | cut -d. -f1-2)/nxmc-${VERSION}.war
          fi

      - name: Create package pin file
        if: matrix.component != 'web'
        run: |
          ./pin-package-version ${{ matrix.component }}/files/netxms-pin ${{ steps.version.outputs.package_version }}

      - name: Build and push Docker image
        if: matrix.component != 'server-e2e'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.component == 'web' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETXMS_VERSION=${{ steps.version.outputs.netxms_version }}
            NETXMS_PACKAGE_VERSION=${{ steps.version.outputs.package_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load e2e image
        if: matrix.component == 'server-e2e'
        uses: docker/build-push-action@v7
        with:
          context: ./server-e2e
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: netxms-server-e2e:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETXMS_VERSION=${{ steps.version.outputs.netxms_version }}
            NETXMS_PACKAGE_VERSION=${{ steps.version.outputs.package_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test e2e image
        if: matrix.component == 'server-e2e'
        timeout-minutes: 3
        run: |
          NX_API_KEY=$(sed -n 's/^NX_API_KEY=//p' README.md)
          if [[ ! "$NX_API_KEY" =~ ^[a-z2-7]{32}$ ]]; then
            echo "::error::README must contain one public fixture API key"
            exit 1
          fi
          docker run --detach --platform linux/amd64 --network none --name netxms-e2e-smoke netxms-server-e2e:smoke
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' netxms-e2e-smoke)" != true ]]; then
              echo "::error::NetXMS exited before the WebAPI became ready"
              exit 1
            fi
            if docker exec netxms-e2e-smoke curl --fail --silent --show-error --connect-timeout 1 --max-time 2 --output /dev/null --header "Authorization: Bearer $NX_API_KEY" http://127.0.0.1:8000/v1/server-info; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::NetXMS WebAPI did not become ready within 120 seconds"
          exit 1

      - name: Push tested e2e image
        if: matrix.component == 'server-e2e' && github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ -z "$IMAGE_TAGS" ]]; then
            echo "::error::No e2e image tags were generated"
            exit 1
          fi
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag netxms-server-e2e:smoke "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: E2e container logs
        if: failure() && matrix.component == 'server-e2e'
        run: |
          if docker container inspect netxms-e2e-smoke > /dev/null 2>&1; then
            docker logs netxms-e2e-smoke
          fi

      - name: Clean up e2e container
        if: always() && matrix.component == 'server-e2e'
        run: |
          if docker container inspect netxms-e2e-smoke > /dev/null 2>&1; then
            docker rm --force --volumes netxms-e2e-smoke
          fi

      - name: Clean up pin file
        if: matrix.component != 'web' && always()
        run: |
          rm -f ${{ matrix.component }}/files/netxms-pin

  test-deployment:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from build.properties
        id: version
        run: |
          NETXMS_VERSION=$(grep '^NETXMS_VERSION=' build.properties | cut -d= -f2)
          echo "netxms_version=${NETXMS_VERSION}" >> $GITHUB_OUTPUT

      - name: Test deployment
        run: |
          cd deployment-example

          # Create test environment file
          cat > .env << EOF
          NETXMS_VERSION=${{ steps.version.outputs.netxms_version }}
          POSTGRES_DB=netxms
          POSTGRES_USER=netxms
          POSTGRES_PASSWORD=test_password
          EOF

          # Use locally built images for testing
          export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}

          # Start services
          docker compose up -d db

          # Wait for database to be ready
          sleep 30

          # Initialize database
          docker compose run --rm init

          # Start remaining services
          docker compose up -d

          # Wait for services to start
          sleep 60

          # Check services are running
          docker compose ps

          # Basic connectivity test
          docker compose exec -T server nxdbmgr get DBLockStatus || true

          # Cleanup
          docker compose down -v

  create-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/release-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from build.properties
        id: version
        run: |
          NETXMS_VERSION=$(grep '^NETXMS_VERSION=' build.properties | cut -d= -f2)
          echo "netxms_version=${NETXMS_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: NetXMS Docker ${{ steps.version.outputs.netxms_version }}
          body: |
            Docker images for NetXMS ${{ steps.version.outputs.netxms_version }}

            ## Images
            - `${{ env.IMAGE_PREFIX }}/agent:${{ steps.version.outputs.netxms_version }}`
            - `${{ env.IMAGE_PREFIX }}/server:${{ steps.version.outputs.netxms_version }}`
            - `${{ env.IMAGE_PREFIX }}/server-e2e:${{ steps.version.outputs.netxms_version }}`
            - `${{ env.IMAGE_PREFIX }}/web:${{ steps.version.outputs.netxms_version }}`

            ## Usage
            ```bash
            cd deployment-example
            NETXMS_VERSION=${{ steps.version.outputs.netxms_version }} docker compose up -d
            ```
          draft: false
          prerelease: false
